name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `cyrius deps` populates ./lib/ from the version-pinned snapshot.
  # The toolchain then notes that ./lib/ shadows its own version cache —
  # informational, not an error. Silence to keep CI logs clean.
  CYRIUS_NO_WARN_SHADOW_LIB: "1"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Cyrius toolchain
        # Pipe the upstream installer (mirrors patra's CI) instead of a raw
        # `curl -sLO | tar xzf` of the release asset. The direct download was
        # silent (`-s`, no `-f`): cyrius cuts releases in bursts, so a freshly
        # bumped pin can have its git tag published minutes before its tarball
        # asset finishes uploading (6.0.87: tag at 20:13Z, assets at 20:20Z).
        # In that window curl saved GitHub's 404 HTML and `tar` died three steps
        # later with "not in gzip format". install.sh fetches with `curl -sSfL`
        # (fails clean on 404), source-bootstraps if the tarball is absent, and
        # sha256-verifies — and lays out ~/.cyrius/{versions,bin,lib} itself.
        run: |
          set -e
          CYRIUS_VERSION="$(grep -oP '(?<=^cyrius = ")[^"]+' cyrius.cyml)"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
          echo "CYRIUS_HOME=$HOME/.cyrius" >> "$GITHUB_ENV"

      - name: Verify toolchain
        # Use the wrapper (`cyrius`) — present in every release. `cc5`
        # was renamed to `cycc` in Cyrius 6.0, so a hard `cc5 --version`
        # breaks the CI install on every 6.x release.
        run: cyrius --version

      - name: Resolve dependencies
        # `./lib/` is gitignored — `cyrius deps` populates it from
        # the version-pinned stdlib snapshot. Must run before any
        # step that resolves `include "lib/..."` (syntax check,
        # fmt, lint, vet, capacity, build).
        run: cyrius deps

      - name: Verify dep hashes
        # Skip on the first push that introduces a new dep before
        # `cyrius.lock` has been generated and committed. Once the
        # lockfile lands in-tree, this step starts enforcing hashes.
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          else
            echo "::warning::cyrius.lock not committed — skipping hash verification"
          fi

      - name: Syntax check
        # agnoshi modules are stitched together through `src/agnsh.cyr`
        # (they don't declare their own includes the way agnosys's do),
        # so per-file `cyrius check` trips on cross-module references
        # (`PermissionLevel`, etc.) that are only resolvable from the
        # entry. Walk from the entry — same posture as vet / capacity /
        # build.
        run: cyrius check src/agnsh.cyr

      - name: Capacity gate
        run: cyrius capacity --check src/agnsh.cyr

      - name: Format check
        # `cyrius fmt --check` is non-mutating: it exits 1 and names the first
        # differing line of each drifting file. (Plain `cyrius fmt <file>`
        # REWRITES IN PLACE and prints nothing — never diff its stdout.)
        #
        # One multi-file invocation, same globs a developer types (CLAUDE.md,
        # CONTRIBUTING.md). Before cyrius 6.6.5, `cyrius fmt` ignored every file
        # after the first, so this gate ran a per-file loop in
        # scripts/check-fmt.sh; 6.6.5 made the CLI take 1..N operands, and 1.9.13
        # retired the script after planting drift in the first, a middle and the
        # last file and watching this exact command exit 1 each time. An
        # unmatched glob reaches cyrfmt literally and fails ("cannot read file"),
        # so a renamed directory cannot turn this into a silent pass.
        run: cyrius fmt --check src/*.cyr tests/*.cyr tests/*.tcyr tests/*.bcyr

      - name: Lint
        # Auto-discover so new modules are covered without editing CI.
        # Treat any warning as a failure.
        run: |
          fail=0
          for f in src/*.cyr tests/*.cyr tests/*.tcyr tests/*.bcyr; do
            [ -f "$f" ] || continue
            out=$(cyrius lint "$f" 2>&1)
            echo "$out"
            if echo "$out" | grep -qE '^\s*warn '; then
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Vet (include-graph audit)
        run: cyrius vet src/agnsh.cyr

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/agnsh.cyr build/agnsh
          echo "agnsh: $(wc -c < build/agnsh) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/agnsh | grep -q "7f45 4c46"

      - name: Cross-build aarch64
        # The toolchain translates x86_64 syscall numbers to aarch64
        # at codegen. Requires cycc_aarch64 (renamed from cc5_aarch64
        # in Cyrius 6.0) in the toolchain bin dir; skip with a warning
        # if the release didn't bundle it.
        run: |
          if [ ! -x "$HOME/.cyrius/bin/cycc_aarch64" ]; then
            echo "::warning::cycc_aarch64 not shipped with Cyrius $CYRIUS_VERSION — skipping aarch64 cross-build"
            exit 0
          fi
          CYRIUS_DCE=1 cyrius build --aarch64 src/agnsh.cyr build/agnsh-aarch64
          file build/agnsh-aarch64 | grep -q "aarch64" || {
            echo "ERROR: build/agnsh-aarch64 is not an aarch64 ELF"; exit 1; }
          echo "agnsh-aarch64: $(wc -c < build/agnsh-aarch64) bytes"

      - name: Tests on aarch64 (qemu-user)
        # ⛔ CI CROSS-BUILT aarch64 FOR TWELVE RELEASES AND NEVER RAN ANY OF IT. OPEN_NOFOLLOW
        # carried x86_64's value, which arm64 reads as O_LARGEFILE, so from 1.9.1 to 1.9.12 the
        # aarch64 release binary followed a symlink planted at either state file: appended to or
        # truncated its target, and chmod'd it 0600. The unit test pinned the wrong number and
        # passed, because the only build it ever ran on was x86_64. 1.9.13 fixed the constant and
        # added a planted-symlink test; this step is what makes that test run on the arch it
        # guards. Verified locally before adding: both suites pass under qemu-aarch64, and the
        # aarch64 test_core build with the 1.9.12 constant restored fails 8 checks.
        run: |
          if [ ! -x "$HOME/.cyrius/bin/cycc_aarch64" ]; then
            echo "::warning::cycc_aarch64 not shipped with Cyrius — skipping aarch64 tests"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user || sudo apt-get install -y -qq qemu-user-static
          QEMU="$(command -v qemu-aarch64 || command -v qemu-aarch64-static)" || {
            echo "::error::no qemu-aarch64 binary after install"; exit 1; }
          for t in tests/test_*.tcyr; do
            [ -f "$t" ] || continue
            name=$(basename "$t" .tcyr)
            echo "=== $name (aarch64, $QEMU) ==="
            CYRIUS_DCE=1 cyrius build --aarch64 "$t" "/tmp/ci_a64_$name"
            "$QEMU" "/tmp/ci_a64_$name"
            rm -f "/tmp/ci_a64_$name"
          done

      - name: Build (agnos target)
        # ⛔ CI BUILT LINUX AND aarch64 — NEITHER OF WHICH COMPILES THE agnos ARM. Large parts of
        # `read_line` (the whole schedulable-stdin path) live inside `#ifdef CYRIUS_TARGET_AGNOS`, so a
        # defect there passes every gate above untouched. 1.8.7 fixed exactly such a defect: the
        # no-bg-jobs read treated the kernel's `-2` (WOULD_BLOCK) as EOF, which killed a PTY-hosted
        # agnsh before its first prompt — and nothing in this pipeline could have seen it.
        # ⚠ It cannot be RUN here (no agnos host), so the gate is the BUILD. That is enough: the
        # failure class this closes is compile-visible on that arm.
        run: |
          mkdir -p build
          cyrius build --agnos src/agnsh.cyr build/agnsh_agnos
          echo "agnsh (agnos): $(wc -c < build/agnsh_agnos) bytes"

      - name: Smoke test
        run: sh scripts/smoke-test.sh build/agnsh

      - name: Coverage gate
        # Cyrius doesn't ship line-coverage instrumentation, so this is
        # fn-level: counts top-level `fn` defs across the modules linked
        # into the agnsh binary (per src/agnsh.cyr's include list) and
        # requires >=80% to be referenced by name in the test files.
        # Threshold is the v1.2.0 roadmap target.
        run: sh scripts/check-coverage.sh 80

      - name: Cstring/Str type-mismatch lint
        # Static analyzer for the Cyrius cstring/Str mismatch class
        # that bit agnoshi five times across v1.2.0/v1.3.0 (silent
        # runtime fallthroughs and aarch64-only build breaks). Greps
        # for known antipatterns: Str-typed fns without _cstr overload
        # (str_cat, str_len, str_data, str_starts_with, str_ends_with)
        # receiving cstring literals, plus raw syscalls (SYS_OPEN /
        # CHMOD / STAT) that don't exist in aarch64's generic table.
        # See scripts/lint-cstr-str.sh for the full pattern list +
        # rationale. Escape hatch: `# lint:cstr-ok` trailing comment.
        run: sh scripts/lint-cstr-str.sh

      - name: Integration tests
        run: |
          for t in tests/test_*.tcyr; do
            [ -f "$t" ] || continue
            name=$(basename "$t" .tcyr)
            echo "=== $name ==="
            CYRIUS_DCE=1 cyrius build "$t" "/tmp/ci_$name"
            "/tmp/ci_$name"
            rm -f "/tmp/ci_$name"
          done

      - name: Benchmarks
        run: |
          CYRIUS_DCE=1 cyrius build tests/bench_core.bcyr build/bench_core
          ./build/bench_core | tee bench-results.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agnsh-${{ github.sha }}
          path: |
            build/agnsh
            bench-results.txt

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for dangerous patterns
        # Matches code lines only — rejects patterns in # comments.
        # Note: this scan is tuned for agnoshi (userland shell), not
        # for a kernel-interface library. agnoshi legitimately references
        # /bin/sudo (sudo invocation) and uses "/bin/" / "/sbin/" prefix
        # strings to *block* writes — so the agnosys-style "any /bin/
        # mention is a write" heuristic would all be false positives.
        # We scan for narrower, agnoshi-specific footguns instead.
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          # Raw execve(59) — every exec must go through the approval +
          # sanitize pipeline. Direct syscalls bypass it.
          scan "raw execve"     'syscall( *59'
          # Direct shadow file access — passwd reads are fine, shadow is not.
          scan "shadow access"  '"/etc/shadow"'
          # Sudo invocation outside src/security.cyr — every sudo path
          # must route through the re-verification + privilege-escalation
          # gate in security.cyr.
          stray_sudo=$(grep -rn '"/bin/sudo"\|"/usr/bin/sudo"' src/ 2>/dev/null \
            | grep -v '^src/security.cyr:' \
            | awk -F: '{ line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
          if [ -n "$stray_sudo" ]; then
            echo "FAIL: stray sudo path (must live in src/security.cyr)"
            echo "$stray_sudo"
            FAIL=1
          fi
          # Unbounded fn-scope buffers — cyrius emits `var buf[N]` inside
          # functions as STATIC DATA, not stack; consecutive calls share
          # the backing memory. 4 KB PATH_MAX buffers are the expected
          # pattern, so warn only at >= 8 KB; >= 64 KB fails the build.
          awk -F: '
            /var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n >= 65536) print FILENAME":"NR": FAIL large static buffer ("n" bytes): "$0
              else if (n >= 8192) print FILENAME":"NR": warn fn-scope buffer ("n" bytes): "$0
            }' src/*.cyr | tee /tmp/bigbuf.txt
          if grep -q "^.*: FAIL " /tmp/bigbuf.txt; then FAIL=1; fi
          # Sanitize module must still exist (security-audit gate).
          test -f src/sanitize.cyr || { echo "FAIL: src/sanitize.cyr missing"; FAIL=1; }
          # Security test suite must still exist.
          test -f tests/test_security.tcyr || { echo "FAIL: tests/test_security.tcyr missing"; FAIL=1; }
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required docs
        run: |
          MISSING=0
          for doc in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md LICENSE cyrius.cyml CLAUDE.md docs/development/roadmap.md docs/doc-health.md; do
            if [ -f "$doc" ]; then echo "  OK: $doc"; else echo "  MISSING: $doc"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify audit report present
        run: |
          test -d docs/audit && ls docs/audit/*.md > /dev/null && echo "OK: audit reports present" || { echo "MISSING: docs/audit/"; exit 1; }

      - name: Verify version consistency
        # ⛔⛔ THIS GATE SHIPPED A LYING BINARY THROUGH TWO RELEASES. It is named for exactly the
        # problem it missed: it checked CHANGELOG.md and the manifest, and NOT the one literal that
        # actually drifts — `var VERSION_STR = "agnoshi X.Y.Z"` in src/agnsh.cyr, which the running
        # binary prints. VERSION went 1.8.6 -> 1.8.7 -> 1.8.8 while the literal stayed at 1.8.6, so
        # `agnsh --version` and the boot banner both reported 1.8.6 from a current build, and CI was
        # green the whole way.
        #
        # ⚠ THE REPAIR MECHANISM ALREADY EXISTED AND WAS SIMPLY NOT RUN. `scripts/version-bump.sh`
        # seds this literal and even carries a count-guard that fails loud if it moves — it was added
        # after the SAME desync hit the 14115 iron burn (banner said 1.8.4-era while VERSION differed).
        # ⇒ A bump script that can be skipped is a CONVENTION, not a mechanism. The gate is what makes
        # it a mechanism, so the check belongs here rather than in more discipline.
        #
        # ⛔ It cost a real false finding on 2026-08-07: a desktop burn log showed `agnoshi 1.8.6` and
        # was written up as "the burn ran a two-versions-stale shell". The staged binary was
        # byte-identical to a fresh build. The log was fine; the string lied.
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          grep -q "$VERSION" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          grep -q '^version = "\${file:VERSION}"' cyrius.cyml || {
            echo "FAIL: cyrius.cyml version must be \${file:VERSION}"; exit 1; }
          # The literal the BINARY prints. Fail on absence as well as mismatch: a moved or reshaped
          # literal must not read as "nothing to check" (that is how a silent skip becomes a desync).
          VS_COUNT=$(grep -c '^var VERSION_STR = "agnoshi ' src/agnsh.cyr || true)
          [ "$VS_COUNT" -eq 1 ] || {
            echo "FAIL: expected exactly 1 'var VERSION_STR = \"agnoshi …\"' in src/agnsh.cyr, found $VS_COUNT"
            echo "      the banner literal moved or changed shape — this gate and scripts/version-bump.sh"
            echo "      both key on that pattern and can no longer keep it in sync with VERSION."
            exit 1; }
          grep -q "^var VERSION_STR = \"agnoshi $VERSION\";\$" src/agnsh.cyr || {
            echo "FAIL: src/agnsh.cyr VERSION_STR does not match VERSION ($VERSION)."
            echo "      found: $(grep '^var VERSION_STR = ' src/agnsh.cyr)"
            echo "      The RUNNING BINARY prints this string, so a mismatch means every log, banner and"
            echo "      burn readout misreports which agnsh is installed."
            echo "      Fix: sh scripts/version-bump.sh \"\$(cat VERSION)\""
            exit 1; }
          echo "Version consistent: VERSION == CHANGELOG == manifest == VERSION_STR ($VERSION)"
